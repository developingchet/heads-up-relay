name: Reviewer layout

# The relay reads the private layout Claude Code's built-in You should know
# reviewer stores its notes in, which any release can change. Each week, look for
# that layout in the newest release's Linux build, without running it, so a
# change fails this workflow before users report it. A pass does not prove that
# notes still arrive; that needs a live session.

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the newest release
        id: release
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
      - name: Unpack its Linux build
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm pack "@anthropic-ai/claude-code-linux-x64@$VERSION" --silent
          tar -xzf "anthropic-ai-claude-code-linux-x64-$VERSION.tgz"
      - name: Look for the reviewer's layout
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          checked=$(sed -n "s/^const CHECKED_RELEASE = '\(.*\)'$/\1/p" hooks/register.ts)
          missing=0
          for marker in 'cc-plugin-you-should-know' 'store.set("sessions"' 'store.set("seen"' \
            'offeredTurn' 'kind:"offer"' 'shownAt' 'typedPastInARow' 'looksToSkip'; do
            if grep -a -q -F "$marker" package/claude; then
              echo "found $marker"
            else
              echo "::error::Claude Code $VERSION no longer contains $marker; the reviewer's layout may have changed."
              missing=1
            fi
          done
          if [ "$VERSION" != "$checked" ]; then
            echo "::notice::Claude Code $VERSION is newer than $checked, the release the relay is checked against. Confirm in a live session that a note still arrives."
          fi
          exit "$missing"
