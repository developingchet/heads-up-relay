name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml, so a tag is released only once its commit passes

permissions:
  contents: read

env:
  DISABLE_AUTOUPDATER: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Claude Code release the relay is checked against, pinned by
      # .github/ci/package-lock.json; keep it in step with the release in
      # .github/reviewer-facts.json.
      - name: Install Claude Code
        run: |
          npm ci --prefix .github/ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate --strict .
      - run: claude plugin test .
      - name: Compare the reviewer's storage with the baseline
        if: runner.os == 'Linux'
        run: node scripts/reviewer-facts.mjs .github/ci/node_modules/@anthropic-ai/claude-code-linux-x64/claude --baseline .github/reviewer-facts.json

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefix tests --no-audit --no-fund
      - run: node --test tests/note.fuzz.js tests/reviewer-facts.test.mjs tests/upstream-check.test.mjs
