name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a usage question, see
        [SUPPORT.md](https://github.com/developingchet/heads-up-relay/blob/main/SUPPORT.md).

        Do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/developingchet/heads-up-relay/security/advisories/new).

        Notes and transcripts can quote your code and conversation: remove anything private before pasting.
  - type: input
    id: version
    attributes:
      label: heads-up-relay version
      description: The version `claude plugin list` shows, or the commit.
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version and OS
      description: Output of `claude --version`, and your operating system.
      placeholder: 2.1.329, Windows 11
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it loaded?
      options: [Installed from the marketplace, Installed from a clone, --plugin-dir, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: mode
      options: [append, log, 'off']
    validations:
      required: true
  - type: dropdown
    id: reviewer
    attributes:
      label: Is the You should know reviewer running in the session?
      description: '`/plugin` lists it where it is available; see "Before you install" in the README.'
      options: ['Yes', 'No', 'Not sure']
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Transcript lines and debug log
      description: The `heads-up-relay:` lines from the transcript, and its lines from a `--debug` session's log.
      render: text

  - type: checkboxes
    id: sanitized
    attributes:
      label: Before submitting
      options:
        - label: I removed code, conversation text and other private content from anything I pasted
          required: true
