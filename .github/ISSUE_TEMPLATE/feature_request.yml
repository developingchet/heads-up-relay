name: Feature request
description: Suggest a change to how notes are relayed
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include exploit details or a security vulnerability in a feature
        request. Use
        [private vulnerability reporting](https://github.com/developingchet/heads-up-relay/security/advisories/new)
        for those reports.

  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
      description: Effects on note framing, the reviewer boundary, the pinned Claude Code release or upgrade paths
    validations:
      required: false
