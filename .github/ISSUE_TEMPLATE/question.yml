name: Question / Support
description: Ask a usage, setup or compatibility question
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Check [Before you install](https://github.com/developingchet/heads-up-relay/blob/main/README.md#before-you-install),
        [Nothing arrives](https://github.com/developingchet/heads-up-relay/blob/main/README.md#nothing-arrives)
        and [Known limits](https://github.com/developingchet/heads-up-relay/blob/main/README.md#known-limits)
        before opening a question.

        Do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/developingchet/heads-up-relay/security/advisories/new).
        Notes and transcripts can quote your code and conversation: remove
        anything private before pasting them.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation and first run
        - Reviewer eligibility and availability
        - Delivery modes and options
        - Notes not arriving
        - Transcript and receipt format
        - Compatibility with Claude Code releases
        - Upgrading, rolling back or removing
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The version `claude plugin list` shows, or the commit
    validations:
      required: true

  - type: input
    id: claude-code
    attributes:
      label: Claude Code version and OS
      description: Output of `claude --version`, and your operating system
      placeholder: 2.1.329, Windows 11
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried, and what happened?
      description: Include the `mode` and `receipt` in use, and any `heads-up-relay:` transcript rows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized transcript rows and debug log
      description: Remove code, conversation text and other private content before pasting
      render: text
    validations:
      required: false

  - type: checkboxes
    id: sanitized
    attributes:
      label: Before submitting
      options:
        - label: I removed code, conversation text and other private content from anything I pasted
          required: true
